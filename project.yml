name: Lumina
options:
  bundleIdPrefix: com.lumina
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
targets:
  Lumina:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    info:
      path: Lumina/Info.plist
    sources:
      - path: Lumina
        excludes:
          - "Info.plist"
          - "**/*.md"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumina.Lumina
        PRODUCT_NAME: Lumina
        INFOPLIST_FILE: Lumina/Info.plist
        GENERATE_INFOPLIST_FILE: false
        # 云编译走「无签名」路线：本地用 AltStore / Sideloadly 侧载时再用你的 Apple ID 重签
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        ENABLE_BITCODE: false
        TARGETED_DEVICE_FAMILY: "1,2"
        ONLY_ACTIVE_ARCH: false
# 显式声明 scheme，保证 CI 上 `xcodebuild -scheme Lumina` 一定能找到
scheme:
  name: Lumina
  build:
    targets:
      Lumina: all
  run:
    target: Lumina
  archive:
    target: Lumina
